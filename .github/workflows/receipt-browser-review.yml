name: Receipt browser review
on:
  push:
    branches: [local-invoice-reuse-guard]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  receipt-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify browser-local allocation with synthetic receipts only
        run: |
          node server.mjs > /tmp/ldn-receipt-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          npx playwright test browser-tests/settlement.spec.mjs --workers=1 --reporter=line
